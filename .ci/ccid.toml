schema = 1
project = "cmbl"

# Preserved hosted Linux gates live here; no pre-existing .ci/ccid.toml existed,
# so every hosted Linux check below is the preserved contract (resolve/cargo-update
# excluded per prior-cohort rule; registry/live reads stay FRESH outside cache).
[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["jq", "--version"], ["curl", "--version"], ["valkey-server", "--version"], ["valkey-cli", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json"]

[checks.advisories]
kind = "commands"
# Merge inside the checked command (runner-level redirection does not survive
# ccid's subprocess pipes): cargo-deny diagnostics must reach the kept log.
commands = [["bash", "-c", "exec 2>&1; exec cargo deny --locked check advisories"]]

[render]
tool_revision = "77a5ac18542750de020ebf753d22c3200530282b"

[jobs.verify]
scheduler = "crow"
checks = ["verify", "advisories"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
