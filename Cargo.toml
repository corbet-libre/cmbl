[package]
name = "cmbl"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
description = "Assembly public-room state machine"
repository = "https://git.corbet.ch/corbet-foss/cmbl"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "1"
cmmr = { git = "https://git.corbet.ch/corbet-foss/cmmr", branch = "main" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
blake3 = "1.8"
data-encoding = "2.9"

[dev-dependencies]
futures = "0.3"
wasm-bindgen-test = "0.3"

[features]
valkey-conformance = ["dep:cvlk", "dep:redis", "dep:tokio"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cvlk = { git = "https://git.corbet.ch/corbet-foss/cvlk", branch = "main", optional = true }
redis = { version = "1", default-features = false, features = ["tokio-comp"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"], optional = true }
